<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #222222; stroke-width: 1.5; rx: 8; ry: 8; }
      .title { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #111111; }
      .text { font: 12px "Segoe UI", Arial, sans-serif; fill: #333333; }
      .group { fill: #f6f7fb; stroke: #c9cdd7; stroke-width: 1.2; rx: 12; ry: 12; }
      .group-title { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #2a2f3a; }
      .line { stroke: #444444; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #888888; stroke-width: 1.0; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#444444"/>
    </marker>
  </defs>

  <rect class="group" x="20" y="20" width="430" height="420"/>
  <text class="group-title" x="40" y="45">Identity &amp; Access</text>

  <rect class="box" x="40" y="70" width="170" height="80"/>
  <text class="title" x="55" y="95">User</text>
  <text class="text" x="55" y="115">id, username</text>
  <text class="text" x="55" y="132">email, role, status</text>

  <rect class="box" x="240" y="70" width="170" height="60"/>
  <text class="title" x="255" y="95">Role</text>
  <text class="text" x="255" y="115">role_name</text>

  <rect class="box" x="240" y="150" width="170" height="60"/>
  <text class="title" x="255" y="175">Permission</text>
  <text class="text" x="255" y="195">module, action</text>

  <rect class="box" x="240" y="230" width="170" height="60"/>
  <text class="title" x="255" y="255">RolePermission</text>
  <text class="text" x="255" y="275">role_id, permission_id</text>

  <rect class="box" x="40" y="170" width="170" height="60"/>
  <text class="title" x="55" y="195">Student</text>
  <text class="text" x="55" y="215">student_id, status</text>

  <rect class="box" x="40" y="250" width="170" height="60"/>
  <text class="title" x="55" y="275">Lecturer</text>
  <text class="text" x="55" y="295">lecturer_id, dept</text>

  <rect class="box" x="40" y="330" width="170" height="60"/>
  <text class="title" x="55" y="355">Admin</text>
  <text class="text" x="55" y="375">user_id</text>

  <rect class="box" x="240" y="330" width="170" height="60"/>
  <text class="title" x="255" y="355">FinanceStaff</text>
  <text class="text" x="255" y="375">user_id</text>

  <rect class="group" x="480" y="20" width="900" height="420"/>
  <text class="group-title" x="500" y="45">Academic Core</text>

  <rect class="box" x="500" y="70" width="180" height="60"/>
  <text class="title" x="515" y="95">Program</text>
  <text class="text" x="515" y="115">program_code, name</text>

  <rect class="box" x="710" y="70" width="180" height="60"/>
  <text class="title" x="725" y="95">AcademicYear</text>
  <text class="text" x="725" y="115">year_name</text>

  <rect class="box" x="920" y="70" width="180" height="60"/>
  <text class="title" x="935" y="95">Semester</text>
  <text class="text" x="935" y="115">semester_name</text>

  <rect class="box" x="500" y="150" width="180" height="60"/>
  <text class="title" x="515" y="175">Course</text>
  <text class="text" x="515" y="195">course_code, name</text>

  <rect class="box" x="710" y="150" width="180" height="60"/>
  <text class="title" x="725" y="175">CourseUnit</text>
  <text class="text" x="725" y="195">unit_title</text>

  <rect class="box" x="920" y="150" width="180" height="60"/>
  <text class="title" x="935" y="175">CourseAssignment</text>
  <text class="text" x="935" y="195">lecturer_id, course_id</text>

  <rect class="box" x="500" y="230" width="180" height="60"/>
  <text class="title" x="515" y="255">SemesterRegistration</text>
  <text class="text" x="515" y="275">student_id, semester_id</text>

  <rect class="box" x="710" y="230" width="180" height="60"/>
  <text class="title" x="725" y="255">CourseRegistration</text>
  <text class="text" x="725" y="275">student_id, course_id</text>

  <rect class="box" x="920" y="230" width="180" height="60"/>
  <text class="title" x="935" y="255">Result</text>
  <text class="text" x="935" y="275">grade, status</text>

  <rect class="box" x="500" y="310" width="180" height="60"/>
  <text class="title" x="515" y="335">StudentGPA</text>
  <text class="text" x="515" y="355">gpa, semester_id</text>

  <rect class="group" x="20" y="470" width="1360" height="460"/>
  <text class="group-title" x="40" y="495">Finance &amp; Communications</text>

  <rect class="box" x="40" y="520" width="200" height="60"/>
  <text class="title" x="55" y="545">FeeStructure</text>
  <text class="text" x="55" y="565">amount, program_id</text>

  <rect class="box" x="270" y="520" width="200" height="60"/>
  <text class="title" x="285" y="545">Invoice</text>
  <text class="text" x="285" y="565">total_amount, status</text>

  <rect class="box" x="500" y="520" width="200" height="60"/>
  <text class="title" x="515" y="545">InvoiceItem</text>
  <text class="text" x="515" y="565">amount</text>

  <rect class="box" x="730" y="520" width="200" height="60"/>
  <text class="title" x="745" y="545">Payment</text>
  <text class="text" x="745" y="565">amount, method</text>

  <rect class="box" x="960" y="520" width="200" height="60"/>
  <text class="title" x="975" y="545">StudentBalance</text>
  <text class="text" x="975" y="565">balance</text>

  <rect class="box" x="40" y="620" width="200" height="60"/>
  <text class="title" x="55" y="645">Announcement</text>
  <text class="text" x="55" y="665">target_audience</text>

  <rect class="box" x="270" y="620" width="200" height="60"/>
  <text class="title" x="285" y="645">Notification</text>
  <text class="text" x="285" y="665">message</text>

  <rect class="box" x="500" y="620" width="200" height="60"/>
  <text class="title" x="515" y="645">ActivityLog</text>
  <text class="text" x="515" y="665">action, module</text>

  <!-- Identity relationships -->
  <line class="line" x1="210" y1="110" x2="240" y2="110"/>
  <line class="line" x1="325" y1="130" x2="325" y2="150"/>
  <line class="line" x1="325" y1="210" x2="325" y2="230"/>

  <line class="line" x1="125" y1="150" x2="125" y2="170"/>
  <line class="line" x1="125" y1="150" x2="125" y2="250"/>
  <line class="line" x1="125" y1="150" x2="125" y2="330"/>
  <line class="line" x1="210" y1="150" x2="240" y2="330"/>

  <!-- Academic relationships -->
  <line class="line" x1="680" y1="100" x2="710" y2="100"/>
  <line class="line" x1="890" y1="100" x2="920" y2="100"/>

  <line class="line" x1="590" y1="130" x2="590" y2="150"/>
  <line class="line" x1="680" y1="180" x2="710" y2="180"/>
  <line class="line" x1="890" y1="180" x2="920" y2="180"/>

  <line class="line" x1="590" y1="210" x2="590" y2="230"/>
  <line class="line" x1="800" y1="210" x2="800" y2="230"/>
  <line class="line" x1="1010" y1="210" x2="1010" y2="230"/>
  <line class="line" x1="1010" y1="290" x2="1010" y2="230"/>

  <line class="line-soft" x1="590" y1="290" x2="590" y2="310"/>

  <!-- Finance relationships -->
  <line class="line" x1="240" y1="550" x2="270" y2="550"/>
  <line class="line" x1="470" y1="550" x2="500" y2="550"/>
  <line class="line" x1="700" y1="550" x2="730" y2="550"/>
  <line class="line" x1="930" y1="550" x2="960" y2="550"/>

  <!-- Cross-domain relationships -->
  <line class="line-soft" x1="125" y1="390" x2="125" y2="520"/>
  <line class="line-soft" x1="590" y1="210" x2="370" y2="520"/>
  <line class="line-soft" x1="1010" y1="290" x2="370" y2="520"/>
  <line class="line-soft" x1="125" y1="390" x2="270" y2="620"/>
  <line class="line-soft" x1="125" y1="390" x2="500" y2="620"/>
</svg>
